<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style_nav.css">
    <link rel="stylesheet" href="../css/as_rep_roasting.css">
    <title>Oxia.Log - AS-REP Roasting</title>
</head>
<body>
    <header>
        <div id="logo"><a href="../index.html">Oxia.Log</a></div>
        <nav id="nav-desktop">
            <ul>
                <li><a href="../about.html">À propos</a></li>
                <li><a href="../contact.html">Contact</a></li>
            </ul>
        </nav>
        <button id="hamburger" aria-label="Menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="nav-mobile" aria-hidden="true">
            <ul>
                <li><a href="../about.html">À propos</a></li>
                <li><a href="../contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <footer>
        <p>&copy; 2026 Oxia.Log. All rights reserved.</p>
    </footer>

    <script>
        const btn = document.getElementById('hamburger');
        const menu = document.getElementById('nav-mobile');

        btn.addEventListener('click', () => {
            const isOpen = menu.classList.contains('open');

            if (isOpen) {
                menu.style.opacity = '0';
                setTimeout(() => {
                    menu.classList.remove('open');
                    menu.style.display = 'none';
                }, 250);
            } else {
                menu.classList.add('open');
                menu.style.display = 'block';
                requestAnimationFrame(() => {
                    menu.style.opacity = '1';
                });
            }

            btn.setAttribute('aria-expanded', !isOpen);
            menu.setAttribute('aria-hidden', isOpen);
        });
    </script>    
</body>
</html>
